name: Release and Build GHCR Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-ghcr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release-and-build:
    if: github.repository == 'hungtx2001/9router' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout triggering master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read and validate package versions
        id: version
        run: |
          set -euo pipefail
          APP_VER=$(node -p "require('./package.json').version")
          CLI_VER=$(node -p "require('./cli/package.json').version")
          [[ "$APP_VER" == "$CLI_VER" ]]
          [[ "$APP_VER" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release only if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping it unchanged."
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists without a release; refusing to reuse it."
            exit 1
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "9Router $RELEASE_TAG" \
              --notes "Published GHCR image: ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          fi
